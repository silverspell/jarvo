[package]
name = "rigagent"
version = "0.1.0"
edition = "2024"

[dependencies]
# LLM agent framework (facade over rig-core + rig-agent), with MCP support.
rig = { version = "0.45.0", features = ["rmcp"] }
# MCP transport: rig-rmcp only enables rmcp's `client` feature, so the stdio
# child-process transport is pulled in here.
rmcp = { version = "3.7", default-features = false, features = [
    "client",
    "transport-child-process",
] }

# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which the
# transcript needs to measure its wrapped height for scrolling. The feature is
# API-unstable, not experimental, and the version is pinned in Cargo.lock.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"

tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1"

clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# HS256 tokens for the office. `rust_crypto` supplies the crypto provider;
# the crate's default features do not include one.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.3"
axum = { version = "0.8.9", features = ["ws"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
# Paused-time tests prove the office join timeout without waiting five seconds.
tokio = { version = "1.54.1", features = ["test-util"] }
